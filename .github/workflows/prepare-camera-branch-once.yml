name: Prepare camera branch once

on:
  push:
    branches:
      - feat/real-camera-jan-ocr-clean

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Format camera changes
        run: |
          dart format \
            lib/infrastructure/camera_recognition_pipeline.dart \
            lib/infrastructure/price_text_parser.dart \
            lib/main.dart \
            lib/presentation/scan_screen.dart \
            test/price_text_parser_test.dart

      - name: Commit generated lock and formatting
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock lib test; then
            echo 'No generated changes required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock \
            lib/infrastructure/camera_recognition_pipeline.dart \
            lib/infrastructure/price_text_parser.dart \
            lib/main.dart \
            lib/presentation/scan_screen.dart \
            test/price_text_parser_test.dart
          git commit -m 'chore: lock and format camera dependencies (#1)'
          git push origin HEAD:feat/real-camera-jan-ocr-clean
