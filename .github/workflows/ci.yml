name: CI

on:
  push:
    branches:
      - master
      - 'chore/**'
      - 'fix/**'
      - 'feat/**'
      - 'test/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Verify generated Drift code
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib/infrastructure/database/app_database.g.dart

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Check formatting of changed Dart files
        shell: bash
        run: |
          mapfile -t dart_files < <(
            git diff --name-only --diff-filter=ACMRT origin/master...HEAD -- '*.dart'
          )

          if (( ${#dart_files[@]} == 0 )); then
            echo 'No changed Dart files to format-check.'
            exit 0
          fi

          printf 'Checking format for:\n%s\n' "${dart_files[*]}"
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"
