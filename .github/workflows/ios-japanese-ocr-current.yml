name: iOS Japanese OCR Current CI

on:
  pull_request:
    branches:
      - fix/japanese-ocr-current-stack
  push:
    branches:
      - ci/ios-japanese-ocr-current-stack

permissions:
  contents: read

concurrency:
  group: ios-japanese-ocr-current-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify Japanese ML Kit configuration
        run: |
          grep -F "pod 'GoogleMLKit/TextRecognitionJapanese', '~> 9.0.0'" ios/Podfile
          grep -F "TextRecognitionScript.japanese" lib/infrastructure/camera_recognition_pipeline.dart

      - name: Build iOS without signing
        run: flutter build ios --debug --no-codesign
