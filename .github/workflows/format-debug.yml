name: Temporary Dart formatter

on:
  push:
    branches:
      - fix/issues-8-9-database-integrity
    paths:
      - .github/workflows/format-debug.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issues-8-9-database-integrity
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Apply canonical formatting
        run: |
          dart format \
            lib/infrastructure/database/app_database.dart \
            lib/infrastructure/price_repository_impl.dart \
            test/unit/price_repository_impl_test.dart
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/infrastructure/database/app_database.dart \
            lib/infrastructure/price_repository_impl.dart \
            test/unit/price_repository_impl_test.dart
          git commit -m 'style: apply canonical Dart formatting'
          git push origin HEAD:fix/issues-8-9-database-integrity
