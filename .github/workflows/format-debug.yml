name: Temporary Dart format probe

on:
  push:
    branches:
      - fix/issues-8-9-database-integrity

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Show canonical formatting
        run: |
          for file in \
            lib/infrastructure/database/app_database.dart \
            lib/infrastructure/price_repository_impl.dart \
            test/unit/price_repository_impl_test.dart
          do
            echo "===== FORMAT:$file ====="
            dart format --output=show "$file"
            echo "===== END:$file ====="
          done
