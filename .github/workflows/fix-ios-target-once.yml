name: Fix iOS deployment target once

on:
  push:
    branches:
      - feat/real-camera-jan-ocr-clean

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Align Xcode project deployment target
        run: >-
          python3 -c "from pathlib import Path; p=Path('ios/Runner.xcodeproj/project.pbxproj'); t=p.read_text(); old='IPHONEOS_DEPLOYMENT_TARGET = 13.0;'; count=t.count(old); assert count == 3, f'expected 3 iOS 13.0 project settings, found {count}'; p.write_text(t.replace(old, 'IPHONEOS_DEPLOYMENT_TARGET = 15.5;'))"

      - name: Commit deployment target fix
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios/Runner.xcodeproj/project.pbxproj
          git commit -m 'fix: align Xcode deployment target to iOS 15.5 (#36)'
          git push origin HEAD:feat/real-camera-jan-ocr-clean
