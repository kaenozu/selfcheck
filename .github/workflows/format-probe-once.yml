name: Format probe once

on:
  push:
    branches:
      - feat/real-camera-jan-ocr-clean

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Show formatter diff
        run: |
          dart format lib/presentation/camera_unavailable_view.dart
          git diff -- lib/presentation/camera_unavailable_view.dart
