name: PR60 format probe

on:
  push:
    branches:
      - probe/pr60-dart-format

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Show exact formatter diff
        run: |
          dart format lib/infrastructure/price_text_parser.dart test/price_text_parser_test.dart
          git diff -- lib/infrastructure/price_text_parser.dart test/price_text_parser_test.dart
